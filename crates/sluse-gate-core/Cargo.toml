[package]
name = "sluse-gate-core"
description = "Sluse Gate Core: the user's tokens, sources read as the user, scope, audit, volume. Runs on the host as SYSTEM; its Gate Front faces the box."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Both targets on purpose. The endpoint's integration test (M3) starts a broker
# in-process on 127.0.0.1:0 and talks to it over real mTLS; that needs a library,
# and a test that spawns the binary instead would prove less and flake more.
[lib]
name = "sluse_gate_core"
path = "src/lib.rs"

[[bin]]
name = "sluse-gate-core"
path = "src/main.rs"

# The deciding half needs none of the TLS and HTTP below and still compiles
# without it; the serving half is what added it. See lib.rs for why the split was
# forced and why it was kept.
[dependencies]
sluse-proto = { path = "../sluse-proto" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
clap.workspace = true

# --- the serving half ------------------------------------------------------
axum.workspace = true
axum-server.workspace = true
# `install_default()` runs as the first statement of `main` and of every test
# that starts a listener. axum-server and reqwest otherwise link two providers
# and rustls refuses to guess, which is a panic on the first handshake.
rustls.workspace = true
tokio-util.workspace = true
futures-core.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true

# --- M7: Entra, On-Behalf-Of and Graph -------------------------------------
# The broker's outbound half. It talks to login.microsoftonline.com and
# graph.microsoft.com **from the host**, so it uses the host's root store — the
# opposite of the endpoint, which trusts one pinned certificate and nothing
# else. That asymmetry is the design: the broker is the trusted side.
reqwest = { workspace = true, features = ["form"] }
jsonwebtoken.workspace = true
aws-lc-rs.workspace = true

# Preflight: `CheckTokenMembership`, the registry reads, `NetLocalGroupGetMembers`.
# Local calls only — never `dsregcmd`, `cmdkey`, `systeminfo` or a network probe,
# which is what tripped SerenIT IT monitoring on 2026-09-14.
#
# Target-gated under D-011, which moved development to an Ubuntu guest. The code
# was already portable: `preflight::platform` has had a `cfg(not(windows))` twin
# answering `Unknown` to every machine check since M2. This dependency line was
# the only thing holding the crate to one platform.
# Enrolment (slice 2): the broker signs each box's client leaf with the client
# CA. The same rcgen `sluse devcert` uses, so there is one way to make a leaf.
rcgen.workspace = true
time.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
# The tests run Core behind a real Front, in one process.
sluse-gate-front = { path = "../sluse-gate-front" }
tempfile.workspace = true
tower.workspace = true
