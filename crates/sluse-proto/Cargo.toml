[package]
name = "sluse-proto"
description = "Sluse shared contract: config schema, wire types, error enum, audit record, content hash."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
sha2.workspace = true
schemars.workspace = true
getrandom.workspace = true

[dev-dependencies]
tempfile.workspace = true

# `cargo run -p sluse-proto --example schema > config/schema.json` regenerates the
# published schema; tests/schema_current.rs fails if the file on disk has drifted.
[[example]]
name = "schema"
