[package]
name = "sluse-lifecycle"
description = "Sluse lifecycle CLI: preflight, start, stop, status, dev certificates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sluse-proto = { path = "../sluse-proto" }
rcgen.workspace = true
# Not called from this crate. It is here so rcgen's `aws-lc-sys` is built with
# `prebuilt-nasm`, which rcgen does not request and this machine has no NASM for.
aws-lc-rs.workspace = true
time.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
sha2.workspace = true
# The box image (slice 3): qcow2's compressed clusters, and the fresh VHD's id.
flate2.workspace = true
getrandom.workspace = true

# The preflight gate and the posture list live in the broker, not here: the
# broker has to run them anyway, because `/v1/health` reports the `posture_id`
# every audit record cites. `sluse check` calls the same code so that one
# machine cannot be described two ways (docs/sluse_prototype.md, M2).
sluse-broker = { path = "../sluse-broker" }

# The probe behind `sluse status` and the "broker reachable" gate is the guest's
# own client, not a second one written here. If the host probed with a client
# that trusted anything the guest does not, "the broker is reachable" would be
# answering a different question from the one the endpoint asks a moment later.
sluse-endpoint = { path = "../sluse-endpoint" }
# `sluse admin setup`, until the setup UI replaces it (D-039 slice 6).
sluse-admin = { path = "../sluse-admin" }
reqwest.workspace = true
tokio.workspace = true

# `OpenProcess` and `TerminateProcess`, for the pid in the state directory.
# There is no portable way to ask whether a pid is still the process that was
# recorded, and a stale pid file that looks live is how a `stop` kills something
# else.
[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-services.workspace = true

# The same question on the guest (D-011). `/proc/<pid>/stat` field 22 is the
# kernel's own start time, which is the exact analogue of `GetProcessTimes`'s
# creation time: a pid plus a start time is an identity, a pid alone is not.
# `libc` is here for `kill(2)` only — reading `/proc` needs nothing — and it is
# already in the locked graph under tokio on unix, so this names what is there.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The CLI is `sluse`, not `sluse-lifecycle`: it is what a person types. The crate
# keeps the component name so the layout table and the binary need not agree.
[[bin]]
name = "sluse"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
# A stand-in for Entra's device code and Microsoft Graph, for admin setup's test.
axum.workspace = true
