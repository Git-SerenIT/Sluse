# The kiosk's sway (D-025, D-027 point 3): tabs, the console first.
# The size at start only: the shell asks for the size of the space under its
# bar (noVNC's resizeSession), and wayvnc sets the headless output to it, so
# nothing is scaled (Q34).
output HEADLESS-1 resolution 1600x900
default_border none
workspace_layout tabbed

# The tab strip, navy in both themes, continuing the shell's bar (Q5): the
# Dark --surface-2 ground and light --ink, the focused tab --ink at 16% over
# it, separated by --surface (ui/console/look/tokens.css). Liberation Sans
# (Q4). sway draws no bold per state and no rule under a tab: the tint is
# what marks the focused one.
font pango:Liberation Sans 10
title_align left
titlebar_padding 12 3
titlebar_border_thickness 1
# class                 border  background text    indicator child_border
client.focused          #15294a #485872    #f5f8fb #485872   #15294a
client.focused_inactive #15294a #273a58    #f5f8fb #273a58   #15294a
client.unfocused        #15294a #273a58    #f5f8fb #273a58   #15294a
client.urgent           #15294a #485872    #f5f8fb #485872   #15294a

# Tabs switch from the keyboard too, focus only: nothing here starts a
# program, so no door is added (Q63, Q84, D-030). One key, round in a
# circle: from the last tab it goes back to the first. Ctrl+Alt+Left did not
# reach the box on L1 (2026-10-21), so it is not bound.
focus_wrapping force
bindsym Ctrl+Mod1+Right focus right

# A tab closes by a middle click on it, or Ctrl+Alt+W for the one in front
# (jok, L1, 2026-10-28): the app is asked to close, as its own close would.
# Never the console's: nothing starts it again, so the criteria leave out a
# window titled Sluse console, and the click on its tab does nothing. By
# title, not app id: Claude Desktop and ChatGPT run under XWayland, with no
# app id to match. A mouse binding acts on the tab under the cursor, so it
# is focused first and the kill takes the focused one.
bindsym button2 focus; [con_id=__focused__ title="^(?!.*Sluse console)"] kill
bindsym Ctrl+Mod1+w [con_id=__focused__ title="^(?!.*Sluse console)"] kill

# Each tab says what it is, whatever the app calls its window (Q5). The
# terminals carry their app id from the console's Open (sluse-endpoint's
# launch); the console's Firefox its own (browser), its title as a second
# match. Any other Firefox is a browser the person or an app opened.
for_window [app_id="^sluse-console$"] title_format "Sluse console"
for_window [app_id="^firefox$" title="Sluse console"] title_format "Sluse console"
for_window [app_id="^firefox$" title="^(?!.*Sluse console)"] title_format "Browser: %title"
for_window [app_id="^sluse-claude-code$"] title_format "Claude Code"
for_window [app_id="^sluse-codex$"] title_format "Codex"
for_window [app_id="^sluse-vibe$"] title_format "Mistral Vibe"
for_window [app_id="^sluse-terminal$"] title_format "Terminal"
for_window [class="^Claude$"] title_format "Claude"
for_window [app_id="^Claude$"] title_format "Claude"
# ChatGPT's ids are read from its package, not seen running (2026-10-26).
for_window [class="^(ChatGPT|chatgpt)$"] title_format "ChatGPT"
for_window [app_id="^chatgpt$"] title_format "ChatGPT"
# The desktop portal and its GTK backend are started by systemd and D-Bus, not
# by sway, and see only what is imported here. Ubuntu's
# /etc/sway/config.d/50-systemd-user.conf does this for its own config, which
# -c skips. Without it the backend times out twice (25 s each): apps that ask
# the portal at start wait, and Firefox cannot hand claude:// to Claude
# Desktop (L1, 2026-10-06).
exec systemctl --user import-environment DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP
exec dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP
# The theme in use in the Sluse window (Q70), kept from the last open.
exec /usr/local/libexec/sluse/theme
exec /usr/local/libexec/sluse/browser
