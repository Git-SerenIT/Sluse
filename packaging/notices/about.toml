# The licences Sluse's binaries may carry (cargo-about). A crate under any
# other licence fails the notices' generation, and so the package build.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
# The MSI's Windows binaries and the box's Linux endpoint.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-dev-dependencies = true
# Sluse's own crates are Apache-2.0, in LICENSE beside this file.
private = { ignore = true }
